<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ktronics — Operations platform (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E51838; --red-dk:#C0122E;
  --ink:#16181A; --ink2:#1F2225; --ink3:#2B2F33;
  --paper:#E6E2DA; --card:#F1EEE8; --rule:#C8C2B6; --rule2:#DCD7CD;
  --mute:#6B665D; --text:#1B1D20;
  --ok:#2E7D5B; --warn:#B5761A; --bad:#C0122E; --blue:#2C5F8A;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--text);font-family:'Roboto',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select{font-family:'Roboto',sans-serif;}
.mono,.num,th,.tag,.pill,.btn,.fld,.sub,.badge,.sechead,.eyebrow{font-family:'Roboto Mono',monospace;}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh;}
.rail{background:var(--ink);color:#EFEDE8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.brand .logo{font-weight:900;font-size:1.125rem;letter-spacing:-.03em;}
.brand .logo b{color:var(--red);}
.brand .sub{font-size:.5625rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(239,237,232,.4);margin-top:3px;}
.nav{padding:10px 0;flex:1;overflow-y:auto;}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
  padding:10px 18px;color:rgba(239,237,232,.6);font-size:.875rem;cursor:pointer;border-left:2px solid transparent;}
.nav button:hover{color:#fff;background:rgba(255,255,255,.04);}
.nav button[aria-current="true"]{color:#fff;border-left-color:var(--red);background:rgba(255,255,255,.06);font-weight:500;}
.nav .kids{background:rgba(0,0,0,.28);}
.nav .kids button{padding:8px 18px 8px 32px;font-size:.8125rem;color:rgba(239,237,232,.5);}
.nav .kids button::before{content:"";width:5px;height:1px;background:currentColor;flex:none;margin-right:-4px;}
.nav .kids button[aria-current="true"]{color:#fff;font-weight:500;}
.badge{margin-left:auto;font-size:.625rem;background:rgba(255,255,255,.14);color:rgba(255,255,255,.72);padding:1px 6px;border-radius:9px;}
.badge.hot{background:var(--red);color:#fff;}
.railfoot{padding:13px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:.5625rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(239,237,232,.34);line-height:1.8;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;}

.main{min-width:0;}
.topbar{background:var(--ink2);color:#EFEDE8;padding:15px 26px;display:flex;align-items:center;gap:18px;border-bottom:2px solid var(--red);}
.topbar h1{margin:0;font-size:1.125rem;font-weight:500;letter-spacing:-.01em;}
.topbar .desc{font-size:.8125rem;color:rgba(239,237,232,.52);margin-left:auto;text-align:right;max-width:48ch;}
.body{padding:20px 26px 60px;}

/* ---------- primitives ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:20px;}
.stat{background:var(--card);padding:15px 17px;}
.stat b{display:block;font-size:1.625rem;font-weight:500;letter-spacing:-.03em;line-height:1.15;}
.stat span{font-family:'Roboto Mono',monospace;font-size:.625rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);display:block;margin-top:4px;line-height:1.4;}
.stat.alert b{color:var(--red);}

.panel{background:var(--card);border:1px solid var(--rule);margin-bottom:20px;}
.panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--rule);}
.panel-head h2{margin:0;font-size:.9375rem;font-weight:500;}
.panel-head .hint{font-size:.8125rem;color:var(--mute);}
.panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

.btn{font-family:'Roboto Mono',monospace;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--ink);background:var(--ink);color:#F1EEE8;cursor:pointer;transition:.15s;}
.btn:hover{background:#000;} .btn:disabled{opacity:.3;cursor:not-allowed;}
.btn.alt{background:transparent;color:var(--ink);} .btn.alt:hover{background:var(--rule2);}
.btn.red{background:var(--red);border-color:var(--red);} .btn.red:hover{background:var(--red-dk);border-color:var(--red-dk);}
.btn.sm{padding:5px 10px;font-size:.625rem;}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

select,input[type=search]{font-family:'Roboto Mono',monospace;font-size:.6875rem;padding:7px 10px;border:1px solid var(--rule);background:#fff;color:var(--text);}
label.fld{display:flex;align-items:center;gap:7px;font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);}

table{width:100%;border-collapse:collapse;}
th{font-size:.5625rem;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);text-align:left;padding:9px 18px;border-bottom:1px solid var(--rule);font-weight:500;white-space:nowrap;}
td{padding:10px 18px;border-bottom:1px solid var(--rule2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr.click{cursor:pointer;} tbody tr:hover{background:#EAE6DF;}
td.num,th.num{font-size:.8125rem;white-space:nowrap;}
.tag{font-family:'Roboto Mono',monospace;font-size:.6875rem;color:var(--mute);}
.strong{font-weight:500;}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.5625rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid currentColor;white-space:nowrap;}
.p-ok{color:var(--ok);} .p-due{color:var(--warn);} .p-over{color:var(--bad);font-weight:700;}
.p-fail{color:#fff;background:var(--bad);border-color:var(--bad);}
.p-sched{color:var(--mute);} .p-live{color:var(--blue);} .p-won{color:#fff;background:var(--ok);border-color:var(--ok);}

.empty{padding:42px 18px;text-align:center;color:var(--mute);}
.check{width:15px;height:15px;accent-color:var(--red);cursor:pointer;}
.bar{height:5px;background:var(--rule2);position:relative;overflow:hidden;margin-top:6px;}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--ok);}
.bar span.warn{background:var(--warn);} .bar span.bad{background:var(--bad);} .bar span.blue{background:var(--blue);}
.note{background:#DFDACF;border-left:3px solid var(--mute);padding:12px 16px;font-size:.8125rem;color:#4A463F;margin-bottom:20px;}
.note b{color:var(--text);font-weight:500;}
.sechead{font-size:.625rem;letter-spacing:.13em;text-transform:uppercase;color:var(--red);margin:0 0 10px;display:flex;align-items:center;gap:9px;}
.sechead::after{content:"";flex:1;height:1px;background:var(--rule);}

/* ---------- site plan ---------- */
.plan-wrap{display:grid;grid-template-columns:1fr 264px;gap:0;}
.plan{background:#DEDAD1;padding:14px;border-right:1px solid var(--rule);}
.plan svg{width:100%;height:auto;display:block;}
.wall{fill:none;stroke:#8C877C;stroke-width:2.5;}
.room{fill:#E9E5DC;stroke:#B4AEA2;stroke-width:1.2;}
.floor{fill:#F1EEE8;stroke:none;}
.fence{fill:none;stroke:#B4AEA2;stroke-width:1.5;stroke-dasharray:7 5;}
.rlabel{font-family:'Roboto Mono',monospace;font-size:9px;letter-spacing:.1em;fill:#8C877C;text-transform:uppercase;}
.dock{stroke:#8C877C;stroke-width:4;}
.pin{cursor:pointer;}
.pin circle{stroke:#F1EEE8;stroke-width:1.6;transition:.15s;}
.pin text{font-family:'Roboto Mono',monospace;font-size:8px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;}
.pin:hover circle{stroke:var(--ink);stroke-width:2.4;}
.pin.dim{opacity:.16;}
.legend{padding:14px 16px;}
.legend h4{margin:0 0 10px;font-size:.75rem;font-weight:500;}
.legend .row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:.8125rem;cursor:pointer;}
.legend .row input{accent-color:var(--red);}
.legend .sw{width:15px;height:15px;border-radius:50%;flex:none;border:1.5px solid #F1EEE8;box-shadow:0 0 0 1px var(--rule);}
.legend .ct{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:.6875rem;color:var(--mute);}
.legend hr{border:none;border-top:1px solid var(--rule);margin:14px 0;}

/* ---------- schedule ---------- */
.sched{display:grid;grid-template-columns:130px repeat(5,1fr);border-left:1px solid var(--rule);}
.sched > div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule2);padding:7px 9px;min-height:58px;}
.sched .hd{background:#DFDACF;font-family:'Roboto Mono',monospace;font-size:.625rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);min-height:0;padding:9px;border-bottom:1px solid var(--rule);}
.sched .who{background:#EAE6DF;font-size:.8125rem;font-weight:500;}
.sched .who small{display:block;font-family:'Roboto Mono',monospace;font-size:.625rem;color:var(--mute);font-weight:400;}
.visit{background:var(--ink);color:#F1EEE8;padding:6px 8px;margin-bottom:4px;font-size:.75rem;line-height:1.35;cursor:pointer;border-left:3px solid var(--red);}
.visit:hover{background:#000;}
.visit b{display:block;font-family:'Roboto Mono',monospace;font-size:.625rem;letter-spacing:.06em;color:rgba(255,255,255,.6);font-weight:400;}
.visit.maint{border-left-color:var(--blue);} .visit.def{border-left-color:var(--warn);}

/* ---------- mode switch ---------- */
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.14);margin:0 18px 4px;border:1px solid rgba(255,255,255,.14);}
.modesw button{background:transparent;border:none;color:rgba(239,237,232,.55);font-family:'Roboto Mono',monospace;font-size:.625rem;letter-spacing:.09em;text-transform:uppercase;padding:8px 4px;cursor:pointer;}
.modesw button[aria-pressed="true"]{background:#F1EEE8;color:var(--ink);font-weight:700;}

/* ---------- technician app ---------- */
.techapp{display:none;background:#101214;min-height:100vh;}
body.tech .app{display:none;}
body.tech .techapp{display:block;}
.phone{max-width:470px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:84px;position:relative;}
@media(min-width:530px){.phone{box-shadow:0 0 60px rgba(0,0,0,.5);}}
.thead{background:var(--ink);color:#F1EEE8;padding:16px 18px 16px;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:12;}
.thead .r1{display:flex;align-items:center;gap:12px;}
.thead .hello{flex:1;min-width:0;}
.thead .hello b{display:block;font-size:1.0625rem;font-weight:500;letter-spacing:-.01em;}
.thead .hello span{font-family:'Roboto Mono',monospace;font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(239,237,232,.45);}
.thead select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#F1EEE8;font-size:.6875rem;padding:6px 8px;border-radius:6px;}
.thead .back{background:none;border:1px solid rgba(255,255,255,.28);color:rgba(239,237,232,.75);font-family:'Roboto Mono',monospace;font-size:.5625rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:6px;cursor:pointer;}
.tbody{padding:16px 15px 30px;}
.tcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;margin-bottom:14px;}
.tcard h3{margin:0 0 3px;font-size:.9375rem;font-weight:500;}
.tlabel{font-family:'Roboto Mono',monospace;font-size:.5625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.tlabel::after{content:"";flex:1;height:1px;background:var(--rule);}

/* message card */
.msg{background:var(--ink);color:#F1EEE8;border:none;border-radius:12px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden;}
.msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);}
.msg .kind{font-family:'Roboto Mono',monospace;font-size:.5625rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:9px;}
.msg p{margin:0;font-size:.9375rem;line-height:1.55;}
.msg .nx{position:absolute;right:12px;bottom:11px;background:none;border:1px solid rgba(255,255,255,.25);color:rgba(239,237,232,.6);border-radius:20px;font-size:.625rem;padding:4px 11px;cursor:pointer;font-family:'Roboto Mono',monospace;letter-spacing:.08em;}
.msg .nx:hover{background:rgba(255,255,255,.1);color:#fff;}

/* big buttons */
.bigbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;min-height:64px;border:none;border-radius:12px;
  font-family:'Roboto',sans-serif;font-size:1.0625rem;font-weight:500;cursor:pointer;margin-bottom:12px;transition:.15s;padding:16px;}
.bigbtn.go{background:var(--red);color:#fff;} .bigbtn.go:active{background:var(--red-dk);}
.bigbtn.stop{background:transparent;color:var(--ink);border:2px solid var(--ink);} .bigbtn.stop:active{background:var(--rule2);}
.bigbtn.proj{background:var(--ink);color:#F1EEE8;} .bigbtn.proj:active{background:#000;}
.bigbtn:disabled{opacity:.35;cursor:not-allowed;}
.bigbtn small{display:block;font-size:.75rem;font-weight:400;opacity:.7;margin-top:2px;}
.onshift{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ok);border-radius:12px;padding:15px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;}
.onshift .big{font-family:'Roboto Mono',monospace;font-size:1.75rem;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;}
.onshift .t{flex:1;font-size:.8125rem;line-height:1.4;}
.onshift .t b{display:block;font-weight:500;}

/* priorities */
.prio{list-style:none;margin:0;padding:0;}
.prio li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule2);font-size:.9375rem;line-height:1.4;cursor:pointer;}
.prio li:last-child{border-bottom:none;}
.prio .box{width:22px;height:22px;border:2px solid var(--mute);border-radius:5px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:.8125rem;color:transparent;transition:.13s;}
.prio li.done .box{background:var(--ok);border-color:var(--ok);color:#fff;}
.prio li.done .txt{text-decoration:line-through;color:var(--mute);}
.prio .txt b{display:block;font-weight:500;}
.prio .txt span{font-family:'Roboto Mono',monospace;font-size:.6875rem;color:var(--mute);}
.prio li.urgent .txt b::after{content:"URGENT";font-family:'Roboto Mono',monospace;font-size:.5rem;letter-spacing:.1em;background:var(--red);color:#fff;padding:2px 5px;margin-left:7px;vertical-align:middle;border-radius:2px;}

/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;}
.kpi b{display:block;font-size:1.5rem;font-weight:500;letter-spacing:-.03em;line-height:1.1;}
.kpi b em{font-style:normal;font-size:.8125rem;color:var(--mute);font-weight:400;}
.kpi span{font-family:'Roboto Mono',monospace;font-size:.5625rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);display:block;margin-top:4px;line-height:1.45;}
.kpi.good b{color:var(--ok);} .kpi.bad b{color:var(--bad);}

/* job cards */
.jcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:15px;margin-bottom:11px;border-left:4px solid var(--blue);cursor:pointer;}
.jcard.maint{border-left-color:var(--ok);} .jcard.def{border-left-color:var(--warn);}
.jcard .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline;}
.jcard .rf{font-family:'Roboto Mono',monospace;font-size:.6875rem;color:var(--mute);}
.jcard h4{margin:3px 0 2px;font-size:.9375rem;font-weight:500;}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:470px;margin:0 auto;background:var(--ink);
  display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.1);z-index:14;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.tabbar button{background:none;border:none;color:rgba(239,237,232,.45);padding:13px 4px 15px;cursor:pointer;
  font-family:'Roboto Mono',monospace;font-size:.5625rem;letter-spacing:.09em;text-transform:uppercase;border-top:2px solid transparent;margin-top:-1px;}
.tabbar button i{display:block;font-style:normal;font-size:1.125rem;margin-bottom:3px;}
.tabbar button[aria-current="true"]{color:#fff;border-top-color:var(--red);}

/* greeting */
.hi{font-size:1.5rem;font-weight:500;letter-spacing:-.02em;line-height:1.2;}
.hi span{display:block;font-family:'Roboto Mono',monospace;font-size:.625rem;letter-spacing:.11em;text-transform:uppercase;color:rgba(239,237,232,.45);font-weight:400;margin-top:4px;}

/* signed-in strip (no ticking clock) */
.instrip{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ok);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.instrip .t{flex:1;font-size:.875rem;line-height:1.4;}
.instrip .t b{display:block;font-weight:500;}
.instrip .t span{font-family:'Roboto Mono',monospace;font-size:.6875rem;color:var(--mute);}
.gpschip{display:inline-flex;align-items:center;gap:5px;font-family:'Roboto Mono',monospace;font-size:.5625rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);padding:3px 7px;border-radius:20px;margin-top:6px;}

/* points + ring */
.scorecard{background:var(--ink);color:#F1EEE8;border-radius:12px;padding:18px;margin-bottom:14px;display:flex;gap:18px;align-items:center;}
.ring{position:relative;flex:none;width:86px;height:86px;}
.ring svg{transform:rotate(-90deg);}
.ring .rc{fill:none;stroke:rgba(255,255,255,.14);stroke-width:8;}
.ring .rf2{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.ring .rf2.done{stroke:#4FBF89;}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .mid b{font-size:1.375rem;font-weight:500;line-height:1;letter-spacing:-.02em;}
.ring .mid span{font-family:'Roboto Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(239,237,232,.5);margin-top:2px;}
.scorecard .sc{flex:1;min-width:0;}
.scorecard .sc b{display:block;font-size:1rem;font-weight:500;margin-bottom:4px;}
.scorecard .sc p{margin:0;font-size:.8125rem;color:rgba(239,237,232,.62);line-height:1.45;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.chip2{font-family:'Roboto Mono',monospace;font-size:.5625rem;letter-spacing:.07em;text-transform:uppercase;background:rgba(255,255,255,.1);color:rgba(239,237,232,.8);padding:4px 9px;border-radius:20px;}
.chip2.fire{background:var(--red);color:#fff;}

/* positive stat rows */
.win{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.win .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;}
.win .h b{font-size:.9375rem;font-weight:500;}
.win .h em{font-style:normal;font-family:'Roboto Mono',monospace;font-size:.8125rem;color:var(--mute);}
.win p{margin:6px 0 0;font-size:.8125rem;color:var(--mute);line-height:1.45;}
.win p.good{color:var(--ok);font-weight:500;}
.win .bar{height:7px;border-radius:4px;}
.win .bar span{border-radius:4px;}

/* priorities award */
.prio li .pts{font-family:'Roboto Mono',monospace;font-size:.625rem;color:var(--mute);align-self:center;flex:none;}
.prio li.done .pts{color:var(--ok);font-weight:500;}

/* job picker */
.jobgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.jtile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;cursor:pointer;text-align:left;border-top:4px solid var(--blue);transition:.13s;}
.jtile:active{background:#EAE6DF;}
.jtile.maint{border-top-color:var(--ok);} .jtile.def{border-top-color:var(--warn);}
.jtile .rf{font-family:'Roboto Mono',monospace;font-size:.625rem;color:var(--mute);}
.jtile h4{margin:5px 0 3px;font-size:.875rem;font-weight:500;line-height:1.25;}
.jtile .st{font-size:.75rem;color:var(--mute);line-height:1.3;}
.tsearch{width:100%;padding:14px 15px;border:1px solid var(--rule);border-radius:10px;font-size:.9375rem;font-family:'Roboto',sans-serif;background:#fff;margin-bottom:14px;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px;}
.duo button{border:none;border-radius:12px;padding:18px 12px;font-family:'Roboto',sans-serif;font-size:.9375rem;font-weight:500;cursor:pointer;}
.duo .nw{background:var(--red);color:#fff;} .duo .sr{background:var(--ink);color:#F1EEE8;}

function estimateView(){
  const S={draft:'<span class="pill p-sched">Draft</span>',sent:'<span class="pill p-live">Out for decision</span>',
    won:'<span class="pill p-won">Won</span>',lost:'<span class="pill p-over">Lost</span>'};
  const pipe=ESTIMATES.filter(e=>e.state==="sent").reduce((s,e)=>s+e.total,0);

  return `<div class="stats">
    <div class="stat"><b>${ESTIMATES.filter(e=>e.state==="draft").length}</b><span>In draft</span></div>
    <div class="stat"><b>${money(pipe/1000)}k</b><span>Out for<br>decision</span></div>
    <div class="stat"><b>${money(won/1000)}k</b><span>Won, awaiting<br>project setup</span></div>
    <div class="stat alert"><b>${DEFECTS.filter(d=>!d.est).length}</b><span>Defects with no<br>estimate yet</span></div>
  </div>
  <div class="panel"><div class="panel-head"><h2>Estimates</h2>
    <span class="hint">Project pricing and defect remedials in one register.</span>
    <div class="right"><button class="btn alt sm" data-go="defects">Estimate a defect</button></div></div>
  <table><thead><tr><th>Ref</th><th>Description</th><th>Site</th><th>Kind</th><th class="num">Raised</th><th class="num">Value</th><th>Status</th></tr></thead><tbody>
  ${ESTIMATES.slice().sort((a,b)=>b.raised-a.raised).map(e=>`<tr><td class="num strong">${e.ref}</td><td>${e.title}</td>
    <td>${site(e.siteId).name}</td><td class="tag">${e.kind}</td><td class="num">${fmt(e.raised)}</td>
    <td class="num">${money(e.total)}</td><td>${S[e.state]}</td></tr>`).join("")}

}

function teamView(){

  const next30=LEAVE.filter(l=>days(l.from)>=0&&days(l.from)<=30);

  /* leave that lands on top of booked work next week */
  const clashes=[];
  LEAVE.forEach(l=>{
    const v=VISITS.filter(x=>x.tech===l.n&&x.date>=l.from&&x.date<=l.to);
    if(v.length) clashes.push({l,v});

  /* 12-week leave calendar from Mon 20 Jul */
  const G0=new Date(2026,6,20), WKS=12, span=WKS*7;

    const away=onLeave(p.n,TODAY), lic=p.exp&&days(p.exp)<=90;

/* ================= technician app ================= */
let MODE="admin", TAB="today", WHO=ME, SHIFT={on:false,since:null};
const PRIODONE=new Set();

const FIRST={"K. Lamb":"Karl","D. Reyes":"Dan","S. Whitmore":"Sam","M. Okafor":"Michael",
  "J. Petrov":"Josef","A. Nguyen":"Amy","L. Hartley":"Louise","T. Brennan":"Tom"};

/* ---- points & goals ---- */
const PTS={priority:15,checkin:10,photo:5,note:5,scan:8,defect:25,close:30};
const GOAL=120;
let EARNED=42;                      /* banked before the app opened */
const STREAK=12, BADGES=[["🔥",STREAK+" day streak",true],["📷","Evidence hound",false],["⚡","SLA beater ×5",false]];
let SHEET=null;                     /* null | "gps" | "prio" */

function priorities(){
  const p=person(WHO), out=[];
  const mine=PROJECTS.filter(x=>x.pm===WHO&&x.state==="active");
  const crit=DEFECTS.filter(d=>d.sev==="Critical"&&!d.est);
  if(crit.length){const a=asset(crit[0].assetId);
    out.push({t:`Attend critical defect — ${a.tag}`,s:`${site(a.siteId).name} · ${crit[0].fault}`,u:true,p:25});}
  mine.slice(0,2).forEach(x=>out.push({t:x.next,s:`${x.ref} · ${site(x.siteId).name}`,u:false,p:20}));
  const od=ASSETS.filter(a=>a.status==="overdue").length;
  if(od) out.push({t:`Pick up overdue services while you're on site`,s:`${od} past due across the estate`,u:false,p:15});
  const tix=(p.tix||[]).filter(([,d])=>days(d)>=0&&days(d)<=60);
  if(tix.length) out.push({t:`Renew ${tix[0][0].toLowerCase()}`,s:`Expires ${fmt(tix[0][1])}`,u:days(tix[0][1])<=14,p:10});
  const draft=TIME.filter(e=>e.tech===WHO&&e.state==="draft").length;
  if(draft) out.push({t:`Submit ${draft} timesheet entr${draft===1?"y":"ies"}`,s:"Week closes Friday 5pm",u:false,p:10});
  out.push({t:"Photograph and tag anything you replace",s:"Keeps the evidence pack clean",u:false,p:15});
  return out.slice(0,6);
}
const earnedTotal=()=>EARNED+[...PRIODONE].reduce((s,i)=>s+(priorities()[i]?priorities()[i].p:0),0)+(CLOCK.live?PTS.checkin:0);

function wins(){
  const mine=TIME.filter(e=>e.tech===WHO);
  const wk=mine.reduce((s,e)=>s+e.mins,0);
  const done=14+(WHO.length%5), target=16;
  const found=DEFECTS.filter(d=>d.est).length+2, value=found*1400;
  const pr=priorities(), pd=[...PRIODONE].length;
  return [
   {t:"Priorities today",v:`${pd} of ${pr.length}`,pc:Math.round(pd/pr.length*100),
    m:pd===pr.length?"All clear. That's the whole list done before knock-off.":pd?`${pr.length-pd} to go — you're moving faster than yesterday.`:"Tick the first one and you're away.",
    good:pd===pr.length},
   {t:"Services closed this month",v:`${done} of ${target}`,pc:Math.round(done/target*100),
    m:done>=target?"Target beaten. Best month you've had.":`${target-done} more and you beat last month.`,good:done>=target},
   {t:"First-time fix",v:"96%",pc:96,m:"Highest on the crew. Almost nothing comes back to you.",good:true},
   {t:"Defects you found",v:`${found} this month`,pc:Math.min(100,found*20),
    m:`Worth about ${money(value)} of remedial work to the team. Finding them is the job.`,good:true},
   {t:"Response vs SLA",v:"1.4 h",pc:88,m:"Well inside the 4-hour promise on every callout.",good:true}
  ];
}

function techToday(){
  const p=person(WHO), pr=priorities(), w=work(CLOCK.ref);
  const pts=earnedTotal(), pc=Math.min(100,Math.round(pts/GOAL*100));
  const C=2*Math.PI*36;
  return `
  ${SHIFT.on?`
    <div class="instrip">
      <div class="t"><b>Signed in to work</b><span>Since ${new Date(SHIFT.since).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"})}</span>

    <div class="ring">
      <svg width="86" height="86" viewBox="0 0 86 86">
        <circle class="rc" cx="43" cy="43" r="36"/>
        <circle class="rf2 ${pc>=100?"done":""}" cx="43" cy="43" r="36"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/>
      </svg>
      <div class="mid"><b>${pc}%</b><span>of goal</span></div>
    </div>
    <div class="sc">
      <b>${pc>=100?"Goal smashed":pc>=70?"You're ahead of pace":pc>=35?"Good start":"Let's get moving"}</b>
      <p>${pts} of ${GOAL} points today${pc>=100?". Everything from here is bonus.":`. ${GOAL-pts} to go — that's about ${Math.ceil((GOAL-pts)/20)} more ticked off.`}</p>
      <div class="chips">${BADGES.map(([i,t,hot])=>`<span class="chip2 ${hot?"fire":""}">${i} ${t}</span>`).join("")}</div>
    </div>
  </div>

  ${wins().map(w2=>`<div class="win">
    <div class="h"><b>${w2.t}</b><em>${w2.v}</em></div>
    <div class="bar"><span class="${w2.good?"":"blue"}" style="width:${w2.pc}%"></span></div>
    <p class="${w2.good?"good":""}">${w2.m}</p></div>`).join("")}`;
}

function wireTech(){
  const $=s=>document.getElementById(s), on=(i,e,f)=>{const x=$(i);if(x)x[e]=f;};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;window._jq="";renderTech();});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  on("whoSel","onchange",e=>{WHO=e.target.value;PRIODONE.clear();renderTech();});

  document.querySelectorAll("[data-sheet]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.sheet;
    if(v==="close"){SHEET=null;}
    else if(v==="show"){SHEET=null;renderTech();
      const el=document.querySelector(".prio"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); return;}
    else SHEET=v;
    renderTech();});

  document.querySelectorAll("[data-prio]").forEach(l=>l.onclick=()=>{
    const i=+l.dataset.prio, pr=priorities()[i];
    if(PRIODONE.has(i)){PRIODONE.delete(i);}
    else{PRIODONE.add(i);
      const left=priorities().length-PRIODONE.size;
      toast(`+${pr.p} points`, left?`${pr.t} — ticked. ${left} to go.`:`That's the lot, ${FIRST[WHO]}. Full list cleared before knock-off.`);}
    renderTech();});

  on("shifton","onclick",()=>{SHIFT.on=true;SHIFT.since=Date.now();SHEET="gps";renderTech();});
  on("shiftoff","onclick",()=>{
    if(CLOCK.live){CLOCK.live=false;CLOCK.since=null;}
    SHIFT.on=false;SHIFT.since=null;
    const pts=earnedTotal();
    toast("Signed out",`${pts} points today and a ${STREAK+1} day streak. Location sharing is off.`);renderTech();});

  on("gopick","onclick",()=>{TAB="jobpick";window._jq="";renderTech();});
  on("jq","oninput",e=>{window._jq=e.target.value;const c=e.target.selectionStart;renderTech();
    const x=$("jq"); if(x){x.focus();x.setSelectionRange(c,c);}});
  on("focussearch","onclick",()=>{const x=$("jq"); if(x)x.focus();});
  on("newjob","onclick",()=>toast("New job","Mockup only — a live build would capture site, contact and scope here, then check you straight in."));
  document.querySelectorAll("[data-pickjob]").forEach(b=>b.onclick=()=>{
    CLOCK.ref=b.dataset.pickjob; CLOCK.live=true; CLOCK.since=Date.now();
    TAB="today"; window._jq="";
    toast(`+${PTS.checkin} points`,`Checked in to ${CLOCK.ref} at ${site(work(CLOCK.ref).siteId).name}.`);
    renderTech();});

  on("tprojoff","onclick",()=>{
    const mins=Math.max(1,Math.round(elapsedMs()/60000)),ac=ACTIVITIES.find(x=>x.a===CLOCK.act),st=new Date(CLOCK.since);
    TIME.push({id:++tSeq,tech:WHO,day:DAYIDX,date:addD(WKSTART,DAYIDX),ref:CLOCK.ref,siteId:work(CLOCK.ref).siteId,
      act:CLOCK.act,bill:ac?ac.bill:true,start:st.getHours()*60+st.getMinutes(),mins,state:"draft"});
    CLOCK.live=false;CLOCK.since=null;
    toast("Checked out",`${hrs(mins)} h logged. Still signed in to work.`);renderTech();});

  document.querySelectorAll("[data-visit2]").forEach(v=>v.onclick=()=>{
    const [ref,sid,kind,h]=v.dataset.visit2.split("|");
    toast(kind+" visit",`${ref} · ${site(sid).name} · ${h} hours allowed.`);});
  document.querySelectorAll("[data-asset]").forEach(r=>r.onclick=()=>assetDrawer(r.dataset.asset));
}

function setMode(m){
  MODE=m; document.body.classList.toggle("tech",m==="tech");
  document.querySelectorAll(".modesw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m));
  m==="tech"?renderTech():render();
}

/* ================= drawers ================= */
function openDrawer(h){document.getElementById("dc").innerHTML=h;
  document.getElementById("drawer").classList.add("show");document.getElementById("scrim").classList.add("show");}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");document.getElementById("scrim").classList.remove("show");}
document.getElementById("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

function assetDrawer(id){
  const a=asset(id),s=site(a.siteId),d=DEFECTS.find(x=>x.assetId===id&&!x.est);
  let h=[],dt=new Date(a.last); for(let i=0;i<4;i++){h.push(new Date(dt));dt=addM(dt,-a.months);}
  openDrawer(`<div class="drawer-head"><button class="closex" onclick="closeDrawer()">✕</button>
    <h3 class="mono">${a.tag}</h3><div class="tag">${a.make} ${a.model} · ${a.type}</div></div>
  <div class="drawer-body">
    <dl class="kv"><dt>Property</dt><dd>${s.name}</dd><dt>Zone</dt><dd>${a.zone}</dd>
      <dt>Installed under</dt><dd>${a.proj} — ${proj(a.proj)?proj(a.proj).name:"—"}</dd>
      <dt>Service level</dt><dd>Every ${a.months} months · ${a.mins} min allowance</dd>
      <dt>Last tested</dt><dd>${fmt(a.last)}</dd><dt>Next due</dt><dd>${fmt(a.due)} ${PILL[a.job?"scheduled":a.status]}</dd></dl>
    ${d?`<h4 class="sechead">Open defect</h4><div class="note" style="margin-bottom:22px"><b>${d.sev}: ${d.fault}</b><br>
      Found ${fmt(d.found)} · estimated remedial ${money(a.cost*1.6)}
      <div style="margin-top:10px"><button class="btn red sm qbtn" data-id="${a.id}">Raise estimate</button></div></div>`:""}
    <h4 class="sechead">Service history</h4>
    <ul class="hist" style="padding-left:14px">${h.map((x,i)=>`<li class="${i===1&&d?"fail":""}">
      <b>${fmt(x)}</b>${i===1&&d?"Failed — "+d.fault:"Tested, passed"} · ${TECHS[i%TECHS.length]}</li>`).join("")}</ul></div>`);
  wire();
}
function projDrawer(ref){
  const p=proj(ref),s=site(p.siteId),as=ASSETS.filter(a=>a.proj===ref);
  openDrawer(`<div class="drawer-head"><button class="closex" onclick="closeDrawer()">✕</button>
    <h3>${p.name}</h3><div class="tag">${p.ref} · ${p.type} · ${s.name}</div></div>
  <div class="drawer-body">
    <dl class="kv"><dt>Property</dt><dd>${s.name}<div class="tag">${s.addr}</div></dd>
      <dt>Client</dt><dd>${s.client}</dd><dt>Lead</dt><dd>${p.pm}</dd>
      <dt>Contract value</dt><dd>${money(p.value)}</dd>
      <dt>Term</dt><dd>${fmt(p.start)} → ${fmt(p.due)}</dd>
      <dt>Progress</dt><dd>${p.pct}%<div class="bar" style="max-width:200px"><span class="blue" style="width:${p.pct}%"></span></div></dd>
      ${p.state==="active"?`<dt>Next milestone</dt><dd>${p.next}</dd>`:""}</dl>
    <h4 class="sechead">Assets under this project (${as.length})</h4>
    ${as.length?`<table style="margin-bottom:22px"><tbody>${as.slice(0,10).map(a=>`<tr class="click" data-asset="${a.id}">
      <td style="padding:7px 0"><span class="mono strong" style="font-size:.8125rem">${a.tag}</span><div class="tag">${a.make} ${a.model} · ${a.zone}</div></td>
      <td style="padding:7px 0;text-align:right">${PILL[a.status]}</td></tr>`).join("")}</tbody></table>
      ${as.length>10?`<p class="tag">+ ${as.length-10} more on the site estate.</p>`:""}`:`<p class="tag">No assets recorded.</p>`}
    <h4 class="sechead">Activity</h4>
    <ul class="hist" style="padding-left:14px">
      <li class="now"><b>${fmt(TODAY)}</b>${p.state==="active"?p.next:"Project closed, warranty running"}</li>
      <li><b>${fmt(addD(TODAY,-18))}</b>Progress claim ${p.state==="past"?"final":"#3"} issued · ${money(p.value*.25)}</li>
      <li><b>${fmt(addD(TODAY,-46))}</b>Variation approved — additional 4 devices</li>
      <li><b>${fmt(p.start)}</b>Project opened from estimate</li></ul></div>`);
  wire();
}
function estimateDrawer(assetId){
  const a=asset(assetId),d=DEFECTS.find(x=>x.assetId===assetId);
  if(d.est){toast("Already estimated",`${d.est} covers ${a.tag}.`);return;}
  const lab=Math.max(2,Math.round(a.mins/30)*2),rate=145;
  const lines=[{d:`${a.part} — ${a.make} ${a.model}`,q:1,r:a.cost},
    {d:"Consumables, fixings, terminations",q:1,r:Math.round(a.cost*.08)},
    {d:"Labour — attend, replace, commission, retest",q:lab,r:rate}];
  const sub=lines.reduce((s,l)=>s+l.q*l.r,0),gst=Math.round(sub*.1),total=sub+gst;
  const ref="E-"+(++eSeq);
  openDrawer(`<div class="drawer-head"><button class="closex" onclick="closeDrawer()">✕</button>
    <h3>Remedial estimate</h3><div class="tag">${a.tag} · ${site(a.siteId).name} · ${d.fault}</div></div>
  <div class="drawer-body">
    <div class="note">Built from the defect. The failed asset supplies the part, its service level supplies the labour allowance, the contract supplies the rate. Nothing retyped.</div>
    <h4 class="sechead">Draft ${ref}</h4>
    <table style="margin-bottom:18px"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>
    ${lines.map(l=>`<tr><td>${l.d}</td><td class="num">${l.q}</td><td class="num">${money(l.r)}</td><td class="num">${money(l.q*l.r)}</td></tr>`).join("")}
    <tr><td colspan="3" class="num" style="text-align:right">Subtotal</td><td class="num">${money(sub)}</td></tr>
    <tr><td colspan="3" class="num" style="text-align:right">GST</td><td class="num">${money(gst)}</td></tr>
    <tr><td colspan="3" class="num strong" style="text-align:right">Total</td><td class="num strong">${money(total)}</td></tr></tbody></table>
    <button class="btn red" id="sendq" data-id="${assetId}" data-ref="${ref}" data-total="${total}">Push to ServiceM8 as a quote</button></div>`);
  wire();
}

/* ================= wiring ================= */
function wire(){
  const $=s=>document.getElementById(s), on=(i,e,f)=>{const x=$(i);if(x)x[e]=f;};
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{view=b.dataset.go;sel.clear();render();});
  on("win","onchange",e=>{window._win=e.target.value;render();});
  on("sf","onchange",e=>{window._sf=e.target.value;sel.clear();render();});
  on("esf","onchange",e=>{window._esf=e.target.value;window._eq="";render();});
  on("eq","oninput",e=>{window._eq=e.target.value;const p=e.target.selectionStart;render();
    const x=$("eq");if(x){x.focus();x.setSelectionRange(p,p);}});
  on("fakeup","onclick",()=>toast("Mockup","Plan upload isn't wired in this demo. Eastern Creek and North Sydney have plans loaded."));
  on("selall","onclick",()=>{document.querySelectorAll(".pk").forEach(c=>sel.add(c.dataset.id));render();});
  document.querySelectorAll(".pk").forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id);render();});
  document.querySelectorAll(".lyr").forEach(c=>c.onchange=()=>{
    window._layers=window._layers||{};window._layers[c.dataset.k]=c.checked;render();});
  document.querySelectorAll("[data-person]").forEach(r=>r.onclick=e=>{e.stopPropagation();personDrawer(r.dataset.person);});
  document.querySelectorAll("[data-asset]").forEach(r=>r.onclick=()=>assetDrawer(r.dataset.asset));
  document.querySelectorAll("[data-proj]").forEach(r=>r.onclick=()=>projDrawer(r.dataset.proj));
  document.querySelectorAll("[data-site]").forEach(r=>r.onclick=()=>{window._esf=r.dataset.site;view="estate";render();});
  document.querySelectorAll(".pin").forEach(p=>p.onclick=()=>assetDrawer(p.dataset.id));
  document.querySelectorAll(".qbtn").forEach(b=>b.onclick=e=>{e.stopPropagation();estimateDrawer(b.dataset.id);});
  document.querySelectorAll("[data-visit]").forEach(v=>v.onclick=()=>{
    const [ref,sid,kind,hrs,tech,note]=v.dataset.visit.split("|");
    toast(kind+" visit",`${ref} · ${site(sid).name} · ${hrs} hrs · ${tech} — ${note}.`);});

  on("raise","onclick",()=>{
    const by={}; [...sel].forEach(id=>{const a=asset(id);(by[a.siteId]=by[a.siteId]||[]).push(a);});
    const refs=[];
    Object.entries(by).forEach(([sid,l])=>{const ref="KTX-"+(++jSeq);
      JOBSQ.push({ref,siteId:sid,count:l.length,mins:l.reduce((s,a)=>s+a.mins,0)});
      l.forEach(a=>{a.job=ref;a.status="scheduled";});refs.push(ref);});
    const c=sel.size;sel.clear();
    toast("Pushed to ServiceM8",`${refs.length} job card(s) — ${refs.join(", ")} — covering ${c} assets. Now waiting for a slot on the Schedule.`);
    render();
  });
  on("clkRef","onchange",e=>{CLOCK.ref=e.target.value;});
  on("clkAct","onchange",e=>{CLOCK.act=e.target.value;});
  on("clkon","onclick",()=>{
    const r=$("clkRef"),a=$("clkAct");
    if(r)CLOCK.ref=r.value; if(a)CLOCK.act=a.value;
    CLOCK.live=true; CLOCK.since=Date.now();
    const w=work(CLOCK.ref);
    toast("Clocked on",`${CLOCK.act} on ${w.ref} at ${site(w.siteId).name}. The timer runs until you clock off.`);
    render();
  });
  on("clkoff","onclick",()=>{
    const mins=Math.max(1,Math.round(elapsedMs()/60000));
    const w=work(CLOCK.ref), ac=ACTIVITIES.find(x=>x.a===CLOCK.act);
    const st=new Date(CLOCK.since);
    TIME.push({id:++tSeq,tech:ME,day:DAYIDX,date:addD(WKSTART,DAYIDX),ref:CLOCK.ref,siteId:w.siteId,
      act:CLOCK.act,bill:ac?ac.bill:true,start:st.getHours()*60+st.getMinutes(),mins,state:"draft"});
    CLOCK.live=false; CLOCK.since=null;
    toast("Clocked off",`${hrs(mins)} hrs logged against ${w.ref}${ac&&ac.bill?" as billable time":" as overhead"}. Sitting in draft until you submit it.`);
    render();
  });
  document.querySelectorAll(".appr").forEach(b=>b.onclick=()=>{
    const e=TIME.find(x=>x.id==b.dataset.id); e.state="approved";
    toast("Approved",`${hrs(e.mins)} hrs for ${e.tech} on ${e.ref} released to payroll and job costing.`);
    render();
  });
  on("apprall","onclick",()=>{
    const p=TIME.filter(e=>e.state==="submitted");
    const m=p.reduce((s,e)=>s+e.mins,0);
    p.forEach(e=>e.state="approved");
    toast("Approved",`${p.length} entries · ${hrs(m)} hrs · ${money(m/60*145)} of labour released to job costing.`);
    render();
  });
  on("tsexport","onclick",()=>{
    const a=TIME.filter(e=>e.state==="approved");
    const m=a.reduce((s,e)=>s+e.mins,0);
    toast("Pushed to payroll",`${hrs(m)} approved hours across ${new Set(a.map(e=>e.tech)).size} staff sent to Xero, split by project for job costing.`);
  });

  on("sendq","onclick",e=>{
    const b=e.target,id=b.dataset.id,ref=b.dataset.ref,total=+b.dataset.total;
    const d=DEFECTS.find(x=>x.assetId===id),a=asset(id);
    d.est=ref; ESTIMATES.push({ref,title:`${a.tag} — ${d.fault}`,siteId:a.siteId,kind:"Remedial",total,state:"draft",raised:TODAY});
    a.status="due"; closeDrawer();
    toast("Estimate raised",`${ref} — ${money(total)} for ${a.tag} — created against ${site(a.siteId).client}, sitting in Estimate as a draft.`);
    render();
  });
}
window.closeDrawer=closeDrawer; window.toast=toast;
setInterval(()=>{
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  if(CLOCK.live){ set("clkTime",elapsedStr()); set("clkTime2",elapsedStr()); set("projTime",elapsedStr()); }
  if(SHIFT.on) set("shiftTime",shiftStr());
},1000);
document.querySelectorAll(".modesw button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
render();
</script>

<div id="opsGate" style="position:fixed;inset:0;z-index:9999;background:#F4F6F8;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'IBM Plex Sans',system-ui,sans-serif">
  <form id="opsGateForm" style="background:#fff;border:1px solid #E7EAEF;border-radius:14px;padding:36px 32px;max-width:360px;width:100%;text-align:center;box-shadow:0 4px 14px rgba(20,24,34,.06)">
    <div style="font-weight:700;font-size:1.4rem;letter-spacing:-.02em;color:#15171C"><span style="color:#E51838">K</span>TRONICS</div>
    <p style="color:#7B818B;font-size:.8rem;margin:10px 0 20px">Operations platform — enter passcode</p>
    <input id="opsGateInput" type="password" autocomplete="current-password" style="width:100%;padding:10px 12px;border:1px solid #E7EAEF;border-radius:8px;font-family:monospace;font-size:.9rem;text-align:center;letter-spacing:.1em" autofocus>
    <button type="submit" style="margin-top:14px;width:100%;padding:10px;border:0;border-radius:8px;cursor:pointer;background:#15171C;color:#fff;font-weight:600;font-size:.85rem">Open</button>
    <div id="opsGateErr" style="color:#E51838;font-size:.74rem;min-height:18px;margin-top:10px;font-weight:500"></div>
  </form>
</div>
<script>
(function(){
"use strict";
var HASH="87abaa24b865ede2411b0f0484eb4ca5a5c7d04000816fff72f86e2032c27f0d";
function sha256(ascii){function rr(v,a){return (v>>>a)|(v<<(32-a));}
var mathPow=Math.pow,maxWord=mathPow(2,32),result='',words=[],asciiBitLength=ascii.length*8;
var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length,isComposite={};
for(var candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(var i=0;i<313;i+=candidate){isComposite[i]=candidate;}
hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;}}
ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=(asciiBitLength);
for(j=0;j<words.length;){var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2];var a=hash[0],e=hash[4];
var temp1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
var temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;}
for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}}
for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}
return result;}
var g=document.getElementById('opsGate');
function unlocked(){try{return sessionStorage.getItem('ktron_auth')==='1';}catch(e){return false;}}
if(unlocked()){g.style.display='none';}
document.getElementById('opsGateForm').addEventListener('submit',function(ev){
ev.preventDefault();
var v=document.getElementById('opsGateInput').value||'';
if(sha256(v)===HASH){try{sessionStorage.setItem('ktron_auth','1');sessionStorage.setItem('ktron_pass',v);}catch(e){}g.style.display='none';}
else{document.getElementById('opsGateErr').textContent='Incorrect passcode.';document.getElementById('opsGateInput').value='';}
});
})();
</script>
