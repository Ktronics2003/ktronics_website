[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Security headers (apply to every response)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long-cache static assets (Astro fingerprints filenames in /_astro/)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# 301 redirects from the old Squarespace URL structure (see 04-sitemap-and-urls.md)
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/home-1"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/access-control"
  to = "/solutions/access-control/"
  status = 301

[[redirects]]
